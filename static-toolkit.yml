---
# Base templates for static site deployments via run-static API
# Cloud-agnostic — only requires RUN_STATIC_URL per job
# Target: merge into miquido/gitlab-templates as static-toolkit.yml
#
# Optional job variables:
#   STATIC_BASIC_AUTH_USER / STATIC_BASIC_AUTH_PASS - basic auth (default: no auth)
#   DMC_PUBLIC - if set (non-empty), also exposes the site under
#                <SUBDOMAIN>.miquido.cloud via the Cloudflare tunnel
#
# Every deploy also writes a .dmc-source file into the deployed directory with
# CI_PROJECT_URL and CI_COMMIT_SHA (both predefined by GitLab, no setup needed),
# so `cat .dmc-source` on the host tells you which repo/commit a deploy dir
# came from.

.deploy-static:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.miquido.com
  before_script:
    - apk add curl zip
  script:
    - |
      if [ -n "$DMC_PUBLIC" ]; then
        touch "${STATIC_DIR:-dist}/.dmc-public"
      fi
      # So anyone who ssh's into the host and lands in the deploy dir can tell
      # where it came from without digging - not web-exposed, since static
      # file servers don't normally serve dotfiles.
      printf '%s\n%s\n' "$CI_PROJECT_URL" "$CI_COMMIT_SHA" > "${STATIC_DIR:-dist}/.dmc-source"
      (cd "${STATIC_DIR:-dist}" && zip -r /tmp/static.zip .)
    - |
      HTTP_STATUS=$(curl -o /tmp/curl_response -w "%{http_code}" \
        -F "file=@/tmp/static.zip" \
        -F "subdomain=${SUBDOMAIN}" \
        -F "basic_auth_user=${STATIC_BASIC_AUTH_USER}" \
        -F "basic_auth_pass=${STATIC_BASIC_AUTH_PASS}" \
        -H "Authorization: Bearer ${GITLAB_OIDC_TOKEN}" \
        "${RUN_STATIC_URL}")
      cat /tmp/curl_response
      if [ "${HTTP_STATUS%%00}" != "2" ]; then
        echo "ERROR: run-static failed with HTTP status: $HTTP_STATUS" >&2
        exit 1
      fi
  tags:
    - docker
    - miquido

.stop-static:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.miquido.com
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add curl
  script:
    - |
      HTTP_STATUS=$(curl -o /tmp/curl_response -w "%{http_code}" -X DELETE \
        -H "Authorization: Bearer ${GITLAB_OIDC_TOKEN}" \
        "${RUN_STATIC_URL}")
      cat /tmp/curl_response
      if [ "${HTTP_STATUS%%00}" != "2" ]; then
        echo "ERROR: stop-static failed with HTTP status: $HTTP_STATUS" >&2
        exit 1
      fi
  tags:
    - docker
    - miquido
