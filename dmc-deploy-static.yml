---
# Template for deploying static sites on DMC
# Required project variables:
#   VIRTUAL_HOST_BASE      - subdomain base, e.g. "my-app" → my-app.dmc.miquido.dev
# Optional:
#   STATIC_DIR             - directory with static files (default: dist)
#   STATIC_BASIC_AUTH_USER - if set (together with the password), the site is protected with basic auth
#   STATIC_BASIC_AUTH_PASS - basic auth password, required together with STATIC_BASIC_AUTH_USER

variables:
  RUN_STATIC_URL: https://docker.dmc.miquido.dev/run-static

.scw-run-static:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.miquido.com
  before_script:
    - apk add curl zip
  script:
    - (cd "${STATIC_DIR:-dist}" && zip -r /tmp/static.zip .)
    - |
      HTTP_STATUS=$(curl -o /tmp/curl_response -w "%{http_code}" \
        -F "file=@/tmp/static.zip" \
        -F "subdomain=${SUBDOMAIN}" \
        -F "basic_auth_user=${STATIC_BASIC_AUTH_USER}" \
        -F "basic_auth_pass=${STATIC_BASIC_AUTH_PASS}" \
        -H "Authorization: Bearer ${GITLAB_OIDC_TOKEN}" \
        "${RUN_STATIC_URL}")
      cat /tmp/curl_response
      if [ "${HTTP_STATUS%%00}" != "2" ]; then
        echo "ERROR: run-static failed with HTTP status: $HTTP_STATUS" >&2
        exit 1
      fi
  tags:
    - docker
    - miquido

.scw-stop-static:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.miquido.com
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add curl
  script:
    - |
      HTTP_STATUS=$(curl -o /tmp/curl_response -w "%{http_code}" -X DELETE \
        -H "Authorization: Bearer ${GITLAB_OIDC_TOKEN}" \
        "${RUN_STATIC_URL}")
      cat /tmp/curl_response
      if [ "${HTTP_STATUS%%00}" != "2" ]; then
        echo "ERROR: stop-static failed with HTTP status: $HTTP_STATUS" >&2
        exit 1
      fi
  tags:
    - docker
    - miquido

deploy:
  extends: .scw-run-static
  variables:
    SUBDOMAIN: $VIRTUAL_HOST_BASE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: $VIRTUAL_HOST_BASE
    url: https://${VIRTUAL_HOST_BASE}.dmc.miquido.dev
    on_stop: stop
    auto_stop_in: 7 days

deploy-mr:
  extends: .scw-run-static
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        SUBDOMAIN: ${VIRTUAL_HOST_BASE}-${CI_MERGE_REQUEST_IID}
  environment:
    name: ${VIRTUAL_HOST_BASE}-${CI_MERGE_REQUEST_IID}
    url: https://${VIRTUAL_HOST_BASE}-${CI_MERGE_REQUEST_IID}.dmc.miquido.dev
    on_stop: stop-mr
    auto_stop_in: 1 day

stop:
  extends: .scw-stop-static
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  environment:
    name: $VIRTUAL_HOST_BASE
    action: stop

stop-mr:
  extends: .scw-stop-static
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  environment:
    name: ${VIRTUAL_HOST_BASE}-${CI_MERGE_REQUEST_IID}
    action: stop
